spring:
  application:
    name: risk-aml-service
  threads:
    virtual:
      enabled: true
  # Trace context (and the MDC) follows @Async work (M12, ADR 0020).
  task:
    execution:
      propagate-context: true
  # Own schema "aml" (SPEC §4), own migrations and own history table (aml.flyway_schema_history), so this service
  # and core-app can share one PostgreSQL locally without touching each other's tables (ADR 0007).
  flyway:
    schemas: aml
    default-schema: aml
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_schema: aml
  # Consumers (M9). Records are JSON written by core-app's outbox; the __TypeId__ header names the contract record.
  # ErrorHandlingDeserializer wraps the JSON one, so a record that can't be read becomes a DeserializationException
  # for the error handler (straight to <topic>.DLT) instead of failing the poll loop forever. Only classes in the
  # event-contracts package may be built from a message. Offsets are committed after the listener returns, i.e.
  # after the database transaction: a crash in between redelivers, and processed_events skips the repeat.
  #
  # Observation on (M12): listeners continue the trace from the W3C traceparent header; producers write it.
  # KafkaConsumerConfig turns it on for the templates it builds itself.
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: risk-aml-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.trustledger.events
        spring.json.use.type.headers: true
    # Dead-letter producer (KafkaConsumerConfig builds its serializers): no duplicates from producer retries.
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
  # Same Keycloak realm and audience as core-app; issuer-uri per environment.
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: trustledger-api

server:
  port: 8081

# Observability (M12, ADR 0020): same as core-app. Tracing always on; OTLP export only with the "obs" profile.
management:
  tracing:
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
        # Seconds, so timers arrive in Prometheus as *_seconds_* (the convention), not *_milliseconds_*.
        base-time-unit: seconds
  # Actuator (SPEC §6 Security): health public, everything else ADMIN (SecurityConfig). Anonymous callers get only
  # the status; an ADMIN token also sees the components. Liveness and readiness are on by default in Boot 4:
  # /actuator/health/liveness and /actuator/health/readiness. Readiness also needs the database.
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      group:
        readiness:
          include: readinessState,db
  # Histogram buckets for http.server.requests, so Grafana can compute p95/p99 per endpoint (M12 dashboard).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    org.apache.kafka: WARN

trustledger:
  # Swagger UI and /v3/api-docs without a token (ADR 0010): only the local profile turns it on.
  security:
    swagger-public: false
  aml:
    kafka:
      # 3 attempts in total (1 try + 2 retries) with 1 s, then 2 s between them; then <topic>.DLT.
      retry:
        max-attempts: 3
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 10s
      # Topic creation is for local and test only (their profiles set create: true); same layout as core-app's.
      topics:
        create: false
        partitions: 3
        replicas: 1
    # FR-AML-3 outbox relay (ADR 0007): sends pending AccountFreezeRequestedV1 rows; at least once, same eventId.
    freeze-relay:
      interval: 1s
      batch-size: 50
      send-timeout: 10s
    # Case detail (FR-AML-4): the wallet's facts from the first alert minus this lookback (the longest rule window)
    # up to the last alert, at most max-facts rows. The case and alert lists page at most max-page-size rows.
    cases:
      fact-lookback: 24h
      max-facts: 500
      max-page-size: 100
    # AML rules R1-R4 (SPEC §2 "AML rules (configurable)", AmlProperties). Amounts in paise. Windows end at the
    # injected Clock's "now". A rule that alerted for a wallet within its window doesn't alert again (R3 always does).
    rules:
      velocity:              # R1, MEDIUM: more than 5 outgoing transfers within 10 minutes
        max-outgoing-transfers: 5
        window: 10m
      structuring:           # R2, HIGH: 3+ transactions of Rs 45,000.00-49,999.99 (both included) within 24 hours
        min-amount-minor: 4500000
        max-amount-minor: 4999999
        min-transactions: 3
        window: 24h
      large-amount:          # R3, MEDIUM: a single transaction of Rs 1,00,000 or more
        min-amount-minor: 10000000
      fan-out:               # R4, HIGH: transfers to 10+ distinct recipients within 24 hours
        min-distinct-recipients: 10
        window: 24h
