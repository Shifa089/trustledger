# Local profile: talks to infra/docker-compose.yml.
# Secrets are read from the git-ignored .env file in the repo root
# (spring-boot:run uses the module directory as working dir, hence ../.env).
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TRUSTLEDGER_ISSUER_URI:http://localhost:8180/realms/trustledger}
  # Kafka from infra/docker-compose.yml.
  kafka:
    bootstrap-servers: localhost:9092
logging:
  pattern:
    correlation: "[%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] "
trustledger:
  # Swagger UI at http://localhost:8081/swagger-ui.html without a token (local only, as in core-app).
  security:
    # Vite dev server (5173) and vite preview (4173) of frontend/ (Keycloak client trustledger-web).
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:4173
    swagger-public: true
  aml:
    kafka:
      # The compose broker doesn't auto-create topics.
      topics:
        create: true
# Every request traced locally (M12): sampling 100% (the default is 10%).
management:
  tracing:
    sampling:
      probability: 1.0
