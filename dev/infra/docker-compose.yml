# Local infrastructure. Run from the repo root:
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml --profile obs up -d   # + Grafana LGTM
# Credentials come from ../.env (copy .env.example). "$$" escapes compose
# interpolation so the variable is expanded inside the container.

name: trustledger

services:
  postgres:
    image: postgres:17
    env_file: ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    env_file: ../.env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Single-node KRaft (broker + controller, no ZooKeeper).
  # INTERNAL listener for other containers (kafka:19092), EXTERNAL for the apps on the host (localhost:9092).
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Dev mode (embedded DB). Imports every realm file in ./keycloak at startup.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    env_file: ../.env
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8080
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl/wget: plain HTTP over bash /dev/tcp to the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Pinned to the last semver community release (no auth token needed).
  localstack:
    image: localstack/localstack:4.14
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,kms
      # Validate presigned-URL signatures and expiry like real S3 (LocalStack skips this by default).
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"s3\": \"\\(available\\|running\\)\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Observability (profile "obs", M12, ADR 0020): Grafana + Prometheus-compatible metrics + Loki + Tempo in one
  # container, receiving OTLP from both apps when they run with the Spring profile "obs" (-Dspring-boot.run.profiles=local,obs).
  # Grafana: http://localhost:3000 (anonymous admin, local only). The "TrustLedger overview" dashboard is provisioned
  # from infra/grafana (read-only mounts; edit the JSON in Git, Grafana reloads it within 30 s).
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    profiles: ["obs"]
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/trustledger.yaml:ro
      - ./grafana/trustledger-dashboard.json:/otel-lgtm/trustledger-dashboards/trustledger-dashboard.json:ro
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Both apps from their images (profile "apps", M14): the containers that CI builds, run against this compose
  # infrastructure. Same Spring "local" profile as spring-boot:run; only the host names change (container names
  # instead of localhost). Stop any spring-boot:run first (same ports 8080/8081). Build and start:
  #   docker compose -f infra/docker-compose.yml --profile apps up -d --build
  #   scripts/smoke.sh
  # core-app also runs the Spring profile "demo": customer1/customer2 get seeded FULL wallets. Their Keycloak IDs are
  # fixed in keycloak/realm-trustledger.json, so a Keycloak container created before that needs --force-recreate.
  # Tokens are requested from http://localhost:8180, so their iss is that URL, which the app keeps checking; only
  # the keys are fetched over the compose network (jwk-set-uri), since localhost inside a container is the container.
  core-app:
    image: trustledger/core-app:local
    build:
      context: ..
      dockerfile: core-app/Dockerfile
    profiles: ["apps"]
    env_file: ../.env
    environment:
      # "demo" seeds customer1/customer2 with FULL KYC and balances (M16), so scripts/smoke.sh works out of the box.
      SPRING_PROFILES_ACTIVE: local,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/$${POSTGRES_DB}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/trustledger/protocol/openid-connect/certs
      TRUSTLEDGER_KYC_STORAGE_ENDPOINT: http://localstack:4566
      TRUSTLEDGER_PRIVACY_STORAGE_ENDPOINT: http://localstack:4566
      TRUSTLEDGER_SMTP_HOST: mailpit
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      localstack: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    restart: unless-stopped

  risk-aml-service:
    image: trustledger/risk-aml-service:local
    build:
      context: ..
      dockerfile: risk-aml-service/Dockerfile
    profiles: ["apps"]
    env_file: ../.env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/$${POSTGRES_DB}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/trustledger/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  localstack-data:
