# Test-only overrides, merged on top of src/main/resources/application.yml
# (classpath:/config/ has higher precedence than classpath:/).
# Fixed, obviously fake keys (32 bytes of 0x01 / 0x02). Never use them anywhere else.
trustledger:
  crypto:
    key: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    index-key: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
  security:
    cors:
      allowed-origins:
        - http://localhost:5173
  # LocalStack (TestcontainersConfiguration supplies endpoint, region and its dummy credentials).
  # Static here, not in the DynamicPropertyRegistrar: @ConditionalOnProperty on the bucket initializer is
  # evaluated before the registrar beans exist, so a dynamic create-bucket=true would come too late.
  # No cron triggers in tests: ITs run reconciliation themselves, so a timed run can't interfere.
  scheduling:
    enabled: false
  # Kafka comes from TestcontainersConfiguration; create the contract topics there like locally.
  events:
    topics:
      create: true
  # WireMock stands in for Razorpay (WireMockConfiguration sets base-url to its random port). Obviously fake
  # test-format keys. Short backoff so retry tests stay fast; the rest keeps the production values.
  razorpay:
    base-url: http://localhost:1
    key-id: rzp_test_FAKEKEY0000000
    key-secret: fake-key-secret-for-tests
    webhook-secret: fake-webhook-secret-for-tests
    retry:
      max-attempts: 3
      initial-backoff: 10ms
      multiplier: 2.0
  kyc:
    storage:
      bucket: trustledger-kyc-test
      path-style: true
      create-bucket: true

# Mailpit comes from TestcontainersConfiguration (host and port). Short SMTP timeouts, so the "mail server down"
# test (Mailpit paused) fails its send in seconds.
spring:
  mail:
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
      mail.smtp.writetimeout: 2000
