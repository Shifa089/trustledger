# Test-only overrides, merged on top of src/main/resources/application.yml
# (classpath:/config/ has higher precedence than classpath:/).
# Fixed, obviously fake keys (32 bytes of 0x01 / 0x02). Never use them anywhere else.
trustledger:
  crypto:
    key: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    index-key: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
  security:
    cors:
      allowed-origins:
        - http://localhost:5173
  # LocalStack (TestcontainersConfiguration supplies endpoint, region and its dummy credentials).
  # Static here, not in the DynamicPropertyRegistrar: @ConditionalOnProperty on the bucket initializer is
  # evaluated before the registrar beans exist, so a dynamic create-bucket=true would come too late.
  # No cron triggers in tests: ITs run reconciliation themselves, so a timed run can't interfere.
  scheduling:
    enabled: false
  kyc:
    storage:
      bucket: trustledger-kyc-test
      path-style: true
      create-bucket: true
