<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrustLedger test checkout</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
    h1 { font-size: 1.4rem; }
    .warn { background: #fff4e5; border: 1px solid #f0b46c; padding: .6rem .8rem; border-radius: 6px; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    textarea, input { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; }
    textarea { height: 6rem; font-family: ui-monospace, monospace; font-size: .8rem; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; font: inherit; cursor: pointer; }
    pre { background: #f3f4f6; padding: .8rem; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>TrustLedger: add money (Razorpay test mode)</h1>
  <p class="warn">Local manual testing only. Use Razorpay <strong>test</strong> cards or UPI <code>success@razorpay</code>.
    No real money moves.</p>

  <label for="token">Access token (CUSTOMER with a wallet, from <code>http/auth.http</code>)</label>
  <textarea id="token" spellcheck="false" autocomplete="off"></textarea>

  <label for="amount">Amount in rupees</label>
  <input id="amount" value="500.00" inputmode="decimal">

  <button id="pay" type="button">Create top-up and pay</button>

  <label for="existing">Or pay an existing PENDING top-up (ID from <code>http/topups.http</code>)</label>
  <input id="existing" placeholder="top-up ID (UUID)" spellcheck="false" autocomplete="off">
  <button id="payExisting" type="button">Pay existing top-up</button>

  <button id="refresh" type="button" disabled>Refresh status</button>

  <h2>Log</h2>
  <pre id="log"></pre>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/checkout.js"></script>
</body>
</html>
