# Local profile: talks to infra/docker-compose.yml.
# Secrets are read from the git-ignored .env file in the repo root
# (spring-boot:run uses the module directory as working dir, hence ../.env).
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TRUSTLEDGER_ISSUER_URI:http://localhost:8180/realms/trustledger}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
  # Kafka from infra/docker-compose.yml.
  kafka:
    bootstrap-servers: localhost:9092
# Human-readable logs locally; correlation ID, then trace and span ID (M12) on every line.
logging:
  pattern:
    correlation: "[%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] "
trustledger:
  security:
    # Vite dev server of the future web app (Keycloak client trustledger-web).
    cors:
      allowed-origins:
        - http://localhost:5173
    swagger-public: true
  # LocalStack from infra/docker-compose.yml. "test"/"test" are LocalStack's dummy credentials, not secrets.
  kyc:
    storage:
      bucket: trustledger-kyc-local
      endpoint: http://localhost:4566
      path-style: true
      access-key: test
      secret-key: test
      create-bucket: true
  # Data exports (FR-PR-2): same LocalStack, a bucket of their own.
  privacy:
    storage:
      bucket: trustledger-privacy-local
      endpoint: http://localhost:4566
      path-style: true
      access-key: test
      secret-key: test
      create-bucket: true
  # Manual test page for Razorpay Checkout in test mode: http://localhost:8080/checkout.html
  # Create the contract topics on the compose broker (3 partitions, replication 1).
  events:
    topics:
      create: true
  payments:
    topups:
      checkout-page: true
# Every request traced locally (M12): sampling 100% (the default is 10%).
management:
  tracing:
    sampling:
      probability: 1.0
