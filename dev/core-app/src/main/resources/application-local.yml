# Local profile: talks to infra/docker-compose.yml.
# Secrets are read from the git-ignored .env file in the repo root
# (spring-boot:run uses the module directory as working dir, hence ../.env).
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TRUSTLEDGER_ISSUER_URI:http://localhost:8180/realms/trustledger}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
# Human-readable logs locally; show the correlation ID on every line.
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
trustledger:
  security:
    # Vite dev server of the future web app (Keycloak client trustledger-web).
    cors:
      allowed-origins:
        - http://localhost:5173
    swagger-public: true
