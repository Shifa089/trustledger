spring:
  application:
    name: core-app
  threads:
    virtual:
      enabled: true
  # Slightly above the 5 MB document limit, so the service's exact check (and its 413 ProblemDetail)
  # decides; anything bigger is cut off by the container before it is read into memory.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  # Resource server: SecurityConfig.jwtDecoder checks signature, expiry, issuer and audience.
  # issuer-uri is set per environment (local profile: compose Keycloak; tests: Testcontainers).
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: trustledger-api

server:
  port: 8080

# Field-encryption and blind-index keys: base64, 32 bytes each, different from each other.
# Supplied as environment variables (locally via .env). Startup fails if missing or invalid.
trustledger:
  crypto:
    key: ${TRUSTLEDGER_CRYPTO_KEY:}
    index-key: ${TRUSTLEDGER_CRYPTO_INDEX_KEY:}
  # CORS allowlist for /api/** (exact origins, no wildcards). Empty = no cross-origin browser access.
  # swagger-public: Swagger UI without a token; only the local profile turns it on.
  security:
    cors:
      allowed-origins: []
    swagger-public: false
  # Currently published policy versions (FR-ID-3). Clients must send exactly these when consenting;
  # bumping one makes users re-accept TERMS/PRIVACY (GET /me/consents shows requiredGiven=false).
  identity:
    policy-versions:
      TERMS: "2026-11-01"
      PRIVACY: "2026-11-01"
      MARKETING: "2026-11-01"
  # Minimum age for KYC (FR-KYC-1), counted in Asia/Kolkata. Startup fails below 18.
  kyc:
    min-age-years: 18
    # FR-KYC-2. max-size is capped at 5MB (startup fails above; the database checks it too).
    # view-link-ttl: lifetime of an officer's presigned download link, at most 5 minutes.
    documents:
      max-size: 5MB
      max-per-case: 10
      required-types: [PAN_CARD, ADDRESS_PROOF]
      view-link-ttl: 5m
    # S3 bucket for KYC documents (ADR 0011). In AWS: no endpoint, credentials from the task role, and the
    # bucket comes from Terraform. The local profile points at LocalStack and creates the bucket.
    storage:
      bucket: ${TRUSTLEDGER_KYC_BUCKET:trustledger-kyc-documents}
      region: ${AWS_REGION:ap-south-1}
      path-style: false
      create-bucket: false
  # Wallet limits per tier (SPEC §2 limits table, FR-W-2). Amounts are QUOTED decimal strings in rupees
  # (bound to Money, never floats). Startup fails on unsafe values, e.g. MIN allowing P2P, or a high-value
  # threshold above the daily transfer limit. The RBI PPI values must be re-verified before production.
  limits:
    high-value-threshold: "50000.00"
    min:
      max-balance: "10000.00"
      monthly-load: "10000.00"
      p2p-allowed: false
    full:
      max-balance: "200000.00"
      monthly-load: "200000.00"
      p2p-allowed: true
      daily-transfer: "100000.00"
  # Per-user budgets in Redis (Bucket4j), keyed by the token subject. 429 RATE_LIMITED when exceeded.
  # Money endpoints use their own, smaller bucket. If Redis is unreachable requests are allowed (fail open).
  rate-limit:
    enabled: true
    default-per-minute: 100
    money-per-minute: 20
    money-endpoints:
      - POST /api/*/transfers
      - POST /api/*/topups
    redis-timeout: 500ms

---
# Every profile except local: structured JSON console logs (Elastic Common Schema).
# MDC entries such as correlationId are included as JSON fields automatically.
spring:
  config:
    activate:
      on-profile: "!local"
logging:
  structured:
    format:
      console: ecs
