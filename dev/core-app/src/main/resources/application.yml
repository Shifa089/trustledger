spring:
  application:
    name: core-app
  threads:
    virtual:
      enabled: true
  # Slightly above the 5 MB document limit, so the service's exact check (and its 413 ProblemDetail)
  # decides; anything bigger is cut off by the container before it is read into memory.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  # Resource server: SecurityConfig.jwtDecoder checks signature, expiry, issuer and audience.
  # issuer-uri is set per environment (local profile: compose Keycloak; tests: Testcontainers).
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: trustledger-api

server:
  port: 8080

# Field-encryption and blind-index keys: base64, 32 bytes each, different from each other.
# Supplied as environment variables (locally via .env). Startup fails if missing or invalid.
trustledger:
  crypto:
    key: ${TRUSTLEDGER_CRYPTO_KEY:}
    index-key: ${TRUSTLEDGER_CRYPTO_INDEX_KEY:}
  # CORS allowlist for /api/** (exact origins, no wildcards). Empty = no cross-origin browser access.
  # swagger-public: Swagger UI without a token; only the local profile turns it on.
  security:
    cors:
      allowed-origins: []
    swagger-public: false
  # Currently published policy versions (FR-ID-3). Clients must send exactly these when consenting;
  # bumping one makes users re-accept TERMS/PRIVACY (GET /me/consents shows requiredGiven=false).
  identity:
    policy-versions:
      TERMS: "2026-11-01"
      PRIVACY: "2026-11-01"
      MARKETING: "2026-11-01"
  # Minimum age for KYC (FR-KYC-1), counted in Asia/Kolkata. Startup fails below 18.
  kyc:
    min-age-years: 18
    # FR-KYC-2. max-size is capped at 5MB (startup fails above; the database checks it too).
    # view-link-ttl: lifetime of an officer's presigned download link, at most 5 minutes.
    documents:
      max-size: 5MB
      max-per-case: 10
      required-types: [PAN_CARD, ADDRESS_PROOF]
      view-link-ttl: 5m
    # S3 bucket for KYC documents (ADR 0011). In AWS: no endpoint, credentials from the task role, and the
    # bucket comes from Terraform. The local profile points at LocalStack and creates the bucket.
    storage:
      bucket: ${TRUSTLEDGER_KYC_BUCKET:trustledger-kyc-documents}
      region: ${AWS_REGION:ap-south-1}
      path-style: false
      create-bucket: false
  # Wallet limits per tier (SPEC §2 limits table, FR-W-2). Amounts are QUOTED decimal strings in rupees
  # (bound to Money, never floats). Startup fails on unsafe values, e.g. MIN allowing P2P, or a high-value
  # threshold above the daily transfer limit. The RBI PPI values must be re-verified before production.
  limits:
    high-value-threshold: "50000.00"
    min:
      max-balance: "10000.00"
      monthly-load: "10000.00"
      p2p-allowed: false
    full:
      max-balance: "200000.00"
      monthly-load: "200000.00"
      p2p-allowed: true
      daily-transfer: "100000.00"
      # Own policy (FR-P-2 "monthly limits"): outgoing P2P per calendar month in Asia/Kolkata. Optional.
      monthly-transfer: "500000.00"
  # Payments (M6). limit-zone: where a "day" and a "month" start for the daily and monthly transfer limits.
  # idempotency: Idempotency-Key rows live for ttl (SPEC: 24 hours); max-body-size bounds the cached request
  # body; the cleanup job deletes expired keys hourly (ShedLock "payments-idempotency-cleanup").
  payments:
    limit-zone: Asia/Kolkata
    idempotency:
      ttl: 24h
      max-body-size: 16KB
      cleanup-cron: "0 15 * * * *"
      cleanup-batch-size: 1000
      lock-at-most-for: 10m
    # Top-ups (M7). min-amount: Razorpay refuses orders below ₹1.00. checkout-page: the manual-test
    # /checkout.html page (Razorpay Checkout in test mode); only application-local.yml turns it on.
    topups:
      min-amount: "1.00"
      checkout-page: false
    # Razorpay webhooks (M7, FR-P-5). The endpoint is public and stores every delivery (accepted or not), so the
    # body size is capped; larger bodies get 413 and are not stored. Razorpay's payment events are a few KB.
    webhooks:
      max-body-size: 64KB
  # Razorpay in TEST MODE ONLY (M7, ADR 0014). Keys come from the environment (.env locally, Secrets Manager on
  # AWS). Startup fails on a live key (anything not rzp_test_...), a blank secret, or plain http to a remote host.
  # timeout: per attempt (TimeLimiter + socket read). The circuit opens when 50% of the last 10 calls failed
  # (timeouts, 5xx, network errors; 4xx rejections don't count) and stays open 30 s. Only GETs are retried:
  # creating an order is not idempotent at Razorpay.
  razorpay:
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    connect-timeout: 1s
    timeout: 3s
    circuit-breaker:
      sliding-window-size: 10
      failure-rate-threshold: 50
      minimum-number-of-calls: 10
      wait-duration-in-open-state: 30s
      permitted-calls-in-half-open: 3
    retry:
      max-attempts: 3
      initial-backoff: 200ms
      multiplier: 2.0
  # Per-user budgets in Redis (Bucket4j), keyed by the token subject. 429 RATE_LIMITED when exceeded.
  # Money endpoints use their own, smaller bucket. If Redis is unreachable requests are allowed (fail open).
  rate-limit:
    enabled: true
    default-per-minute: 100
    money-per-minute: 20
    money-endpoints:
      - POST /api/*/transfers
      - POST /api/*/topups
    redis-timeout: 500ms
  # Cron triggers for scheduled jobs (ADR 0013). false switches them off (tests); manual runs still work.
  scheduling:
    enabled: true
  # FR-L-4: nightly wallet-vs-ledger check, 02:00 India time (6-field Spring cron). Also
  # POST /api/v1/admin/reconciliation/run (ADMIN). Mismatches: WARN log + trustledger.reconciliation.mismatches.
  reconciliation:
    cron: "0 0 2 * * *"
    zone: Asia/Kolkata
    batch-size: 500
    max-listed-mismatches: 1000
    lock-at-most-for: 30m
    lock-at-least-for: 1m

---
# Every profile except local: structured JSON console logs (Elastic Common Schema).
# MDC entries such as correlationId are included as JSON fields automatically.
spring:
  config:
    activate:
      on-profile: "!local"
logging:
  structured:
    format:
      console: ecs
